[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kvip"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = ["numpy", "numba"]

[tool.setuptools.packages.find]
where = ["python"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
